name: Build Mada Pay Central Android and Web

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'mada_pay_main_golden_updated.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mada-pay-central-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل ملفات المشروع من GitHub
      - name: Download repository
        uses: actions/checkout@v4

      # 2. تثبيت Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 3. التأكد من وجود ملف الكود الجديد
      # ثم نقله إلى lib/main.dart
      - name: Copy updated code to lib/main.dart
        shell: bash
        run: |
          set -e

          SOURCE="mada_pay_main_golden_updated.dart"
          TARGET="lib/main.dart"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: File $SOURCE was not found in the repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          mkdir -p lib
          cp "$SOURCE" "$TARGET"

          if [ ! -s "$TARGET" ]; then
            echo "ERROR: lib/main.dart is empty."
            exit 1
          fi

          echo "Code copied successfully to lib/main.dart."
          echo "Source file size:"
          wc -c "$SOURCE"

          echo "Target file size:"
          wc -c "$TARGET"

      # 4. إنشاء ملفات Android والويب عند الحاجة
      - name: Generate Android and Web platform files
        run: flutter create --platforms=android,web --project-name=mada_pay_central .

      # 5. ضبط أذونات Android وإعدادات Gradle
      - name: Configure Android permissions and SDK
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml was not generated."
            find android -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          # السماح بالاتصال بالإنترنت
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          # السماح باستخدام المصادقة الحيوية
          if ! grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST"
          fi

          # تحديد ملف Gradle المستخدم
          GRADLE_KTS="android/app/build.gradle.kts"
          GRADLE_GROOVY="android/app/build.gradle"

          if [ -f "$GRADLE_KTS" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$GRADLE_KTS"
            echo "Configured Kotlin Gradle file."

          elif [ -f "$GRADLE_GROOVY" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$GRADLE_GROOVY"
            echo "Configured Groovy Gradle file."

          else
            echo "ERROR: Gradle file was not found."
            find android -maxdepth 4 -type f \( \
              -name 'build.gradle' -o \
              -name 'build.gradle.kts' \
            \)
            exit 1
          fi

          echo "Android permissions configured:"
          grep 'uses-permission' "$MANIFEST"

      # 6. ضبط إصدارات SDK الخاصة بحزمة app_links إن وجدت
      - name: Configure Android SDK versions
        shell: bash
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/app_links-*/android/build.gradle" \
            -type f \
            -exec sed -i \
            's/flutter.compileSdkVersion/35/g; s/flutter.minSdkVersion/24/g; s/flutter.targetSdkVersion/35/g' {} \; || true

      # 7. تنزيل حزم Flutter
      - name: Download dependencies
        run: flutter pub get

      # 8. التأكد من سلامة كود Dart
      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib

      # 9. التحقق من وجود بيانات Supabase في GitHub Secrets
      - name: Verify Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: Missing SUPABASE_URL GitHub Secret."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: Missing SUPABASE_KEY GitHub Secret."
            exit 1
          fi

          echo "Supabase configuration secrets are present."

      # 10. بناء تطبيق Android بصيغة APK
      - name: Build Android APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      # 11. التأكد من وجود APK ومن إذن الإنترنت
      - name: Verify Internet permission in APK manifest
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK generated successfully."

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          AAPT="$(find "$SDK/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -n 1)"

          if [ -n "$AAPT" ]; then
            "$AAPT" dump permissions "$APK"

            if ! "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
              echo "ERROR: Internet permission is missing from APK."
              exit 1
            fi

            echo "Internet permission verified."
          else
            echo "WARNING: aapt was not found; manifest verification skipped."
          fi

      # 12. بناء نسخة الموقع
      - name: Build website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      # 13. حفظ ملف APK كأحد مخرجات البناء
      - name: Save Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-central-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 14. حفظ ملفات الموقع
      - name: Save website files
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-central-website
          path: build/web/**
          if-no-files-found: error

      # 15. حفظ ملف قفل الاعتماديات
      - name: Save dependency lock file
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-central-dependency-lock
          path: pubspec.lock
          if-no-files-found: error
