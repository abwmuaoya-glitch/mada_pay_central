name: Build Mada Pay Central Android and Web

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mada-pay-central-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android and Web platform files
        run: flutter create --platforms=android,web --project-name=mada_pay_central .

      - name: Configure Android biometric support
        shell: bash
        run: |
          MAIN="android/app/src/main/kotlin/com/example/mada_pay_central/MainActivity.kt"
          if [ -f "$MAIN" ]; then
            sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAIN"
          fi

          GRADLE="android/app/build.gradle.kts"
          if [ -f "$GRADLE" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$GRADLE"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST"
          fi

      - name: Configure Android SDK versions
        shell: bash
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" -path "*/app_links-*/android/build.gradle" -type f -print -exec sed -i 's/flutter.compileSdkVersion/35/g; s/flutter.minSdkVersion/24/g; s/flutter.targetSdkVersion/35/g' {} \;
 
      - name: Download dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib

      - name: Verify Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'Missing SUPABASE_URL GitHub Secret' && exit 1)
          test -n "$SUPABASE_KEY" || (echo 'Missing SUPABASE_KEY GitHub Secret' && exit 1)

      - name: Build Android APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Build website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: flutter build web --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Save Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-central-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Save website files
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-central-website
          path: build/web/**

      - name: Save dependency lock file
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-central-dependency-lock
          path: pubspec.lock
