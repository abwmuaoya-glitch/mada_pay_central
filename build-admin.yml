name: Build Mada Pay Android and Web
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mada-pay-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android and Web platform files
        run: flutter create --platforms=android,web --project-name=mada_pay_central .
      - name: Configure biometric support on Android
        shell: bash
        run: |
          MAIN="android/app/src/main/kotlin/com/example/mada_pay_central/MainActivity.kt"
          if [ -f "$MAIN" ]; then sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAIN"; fi
          GRADLE="android/app/build.gradle.kts"
          if [ -f "$GRADLE" ]; then sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$GRADLE"; fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST"; then sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST"; fi
      - name: Resolve exact direct dependency versions
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Verify Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'Missing SUPABASE_URL GitHub Secret' && exit 1)
          test -n "$SUPABASE_KEY" || (echo 'Missing SUPABASE_KEY GitHub Secret' && exit 1)
      - name: Build Android APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
      - name: Build Flutter website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: flutter build web --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: mada-pay-central-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mada-pay-central-website
          path: build/web/**
      - uses: actions/upload-artifact@v4
        with:
          name: mada-pay-dependency-lock
          path: pubspec.lock
